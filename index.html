<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>뉴스 각도기</title>
<meta name="description" content="부동산·주식·코인·매크로 뉴스를 주제별로 모아 자산시장 영향과 우선순위를 붙인 뉴스판">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style id="gk-toss">
/* 각도기 토스풍 공통 스타일 (2026-11-07, PD "토스처럼 직관적으로, 글자가 너무 많고 가독성이 낮아")
   원본은 C:\Work\각도기\각도기 공통\토스.css. 각 앱 만들기가 화면 머리의 자리표시 <!--__GAKDOGI_STYLE__--> 를
   이 파일(과 Pretendard 글꼴 링크)로 바꾼다(각도기공통.add_bar). 고칠 땐 이 원본만 고치고 앱들을 다시 만든다.
   쓰는 법은 '토스 디자인.md'.
   1) 색 이름(--t-*)  2) 앱 틀들이 원래 쓰던 색 이름(--page·--ink…, 뉴스 --bg·--text…)을 토스 색에 잇기
   3) 바탕 글꼴·글자  4) 공통 부품(t- 로 시작) */

:root {
  color-scheme: light;
  --t-bg: #f2f4f6; --t-card: #ffffff; --t-fill: #f2f4f6; --t-fill2: #e5e8eb; --t-soft: #f9fafb;
  --t-line: #e5e8eb; --t-line2: #d1d6db;
  --t-text: #191f28; --t-text2: #4e5968; --t-text3: #8b95a1; --t-text4: #b0b8c1;
  --t-blue: #3182f6; --t-blue-ink: #1b64da; --t-blue-weak: #e8f3ff;
  --t-red: #f04452; --t-red-ink: #d22030; --t-red-weak: #ffeeee;
  --t-green: #03b26c; --t-green-ink: #028450; --t-green-weak: #e5f8ef;
  --t-orange: #fe9800; --t-orange-ink: #c26e00; --t-orange-weak: #fff3e0;
  --t-yellow: #ffc342; --t-purple: #8b5cf6;
  --t-shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 2px 10px rgba(0, 0, 0, .03);
  --t-pop: 0 8px 28px rgba(0, 0, 0, .14);
  --t-r: 20px; --t-r2: 14px; --t-r3: 10px;
  --t-font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;

  /* 주식·부동산·코인·리포트 틀이 쓰던 이름 */
  --page: var(--t-bg); --surface: var(--t-card); --raised: var(--t-soft);
  --ink: var(--t-text); --ink2: var(--t-text2); --muted: var(--t-text3);
  --grid: #eef0f3; --axis: #d1d6db; --line: var(--t-line);
  --s1: #3182f6; --s2: #f0602e; --s3: #03b26c; --s4: #f5b400;   /* s2(주황빨강)·s4(호박색)는 한 그림에 같이 나와도 갈리게 */
  --up: var(--t-red); --down: var(--t-blue); --flat: var(--t-text3); --focus: var(--t-blue);
  /* 뉴스 틀이 쓰던 이름 */
  --bg: var(--t-bg); --panel: var(--t-card); --panel2: var(--t-soft); --text: var(--t-text); --faint: var(--t-text3);
  --chip: var(--t-fill); --shadow: var(--t-shadow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --t-bg: #17171c; --t-card: #222228; --t-fill: #2c2c34; --t-fill2: #3a3a44; --t-soft: #2a2a31;
    --t-line: #33333c; --t-line2: #44444f;
    --t-text: #f2f3f5; --t-text2: #b5b6bd; --t-text3: #85868f; --t-text4: #5d5e66;
    --t-blue: #4d98ff; --t-blue-ink: #7ab2ff; --t-blue-weak: rgba(77, 152, 255, .16);
    --t-red: #ff5d6a; --t-red-ink: #ff8c95; --t-red-weak: rgba(255, 93, 106, .16);
    --t-green: #22c381; --t-green-ink: #5ad6a2; --t-green-weak: rgba(34, 195, 129, .16);
    --t-orange: #ffab2e; --t-orange-ink: #ffc266; --t-orange-weak: rgba(255, 171, 46, .16);
    --t-shadow: none; --t-pop: 0 8px 28px rgba(0, 0, 0, .5);
    --grid: #2e2e36; --axis: #44444f;
    --s1: #4d98ff; --s2: #ff7a45; --s3: #22c381; --s4: #ffc94d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --t-bg: #17171c; --t-card: #222228; --t-fill: #2c2c34; --t-fill2: #3a3a44; --t-soft: #2a2a31;
  --t-line: #33333c; --t-line2: #44444f;
  --t-text: #f2f3f5; --t-text2: #b5b6bd; --t-text3: #85868f; --t-text4: #5d5e66;
  --t-blue: #4d98ff; --t-blue-ink: #7ab2ff; --t-blue-weak: rgba(77, 152, 255, .16);
  --t-red: #ff5d6a; --t-red-ink: #ff8c95; --t-red-weak: rgba(255, 93, 106, .16);
  --t-green: #22c381; --t-green-ink: #5ad6a2; --t-green-weak: rgba(34, 195, 129, .16);
  --t-orange: #ffab2e; --t-orange-ink: #ffc266; --t-orange-weak: rgba(255, 171, 46, .16);
  --t-shadow: none; --t-pop: 0 8px 28px rgba(0, 0, 0, .5);
  --grid: #2e2e36; --axis: #44444f;
  --s1: #4d98ff; --s2: #ff7a45; --s3: #22c381; --s4: #ffc94d;
}

/* ── 바탕 ── */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--t-bg); color: var(--t-text);
  font-family: var(--t-font); font-size: 16px; line-height: 1.6; letter-spacing: -.01em;
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font-family: inherit; letter-spacing: inherit; }
a { color: var(--t-blue-ink); }
:focus-visible { outline: 2px solid var(--t-blue); outline-offset: 2px; }
.num, .t-num { font-variant-numeric: tabular-nums; }

/* ── 쪽 틀 ── */
.t-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }
.t-wrap.wide { max-width: 1120px; }
.t-head { padding: 28px 4px 12px; }
.t-head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.3; }
.t-head .t-cap { margin-top: 4px; }

/* 위에 붙는 구역 탭: 글자 탭, 지금 구역만 진하게 */
.t-tabs { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--t-bg) 94%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.t-tabs .in { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 8px 0; }
.t-tabs .in::-webkit-scrollbar { display: none; }
.t-tabs a { flex: none; text-decoration: none; padding: 7px 12px; border-radius: 99px; font-size: 15px; font-weight: 600; color: var(--t-text3); white-space: nowrap; }
.t-tabs a:hover { color: var(--t-text2); }
.t-tabs a.on { color: var(--t-card); background: var(--t-text); }

/* ── 구역 ── */
.t-section { padding-top: 32px; }
.t-section > .t-sh, .t-sh { display: flex; align-items: baseline; gap: 8px; margin: 0 4px 12px; }
.t-sh h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1.35; }
.t-sh .t-cap { margin-left: auto; white-space: nowrap; }
.t-lead { margin: -4px 4px 14px; font-size: 15px; color: var(--t-text2); line-height: 1.6; }

/* ── 카드 ── */
.t-card { background: var(--t-card); border-radius: var(--t-r); padding: 22px 20px; box-shadow: var(--t-shadow); min-width: 0; }
.t-card + .t-card { margin-top: 12px; }
a.t-card { display: block; color: inherit; text-decoration: none; }
a.t-card:active { transform: scale(.99); }
.t-card.tap { cursor: pointer; transition: background .15s; }
.t-card.tap:hover { background: color-mix(in srgb, var(--t-card) 96%, var(--t-text)); }
.t-in { background: var(--t-soft); border-radius: var(--t-r2); padding: 16px; }   /* 카드 안의 회색 칸 */
.t-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.t-grid > * { min-width: 0; }
.t-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .t-grid.two.stack { grid-template-columns: 1fr; } }

/* ── 글자 크기 단계: 라벨 → 큰 숫자 → 한 줄 설명 ── */
.t-label { font-size: 14px; font-weight: 500; color: var(--t-text3); line-height: 1.45; }
.t-big { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.25; font-variant-numeric: tabular-nums; }
.t-mid { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.35; font-variant-numeric: tabular-nums; }
.t-h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.4; margin: 0; }
.t-body { font-size: 16px; color: var(--t-text); line-height: 1.6; }
.t-sub { font-size: 15px; color: var(--t-text2); line-height: 1.55; }
.t-cap { font-size: 13px; color: var(--t-text3); line-height: 1.5; }
@media (max-width: 560px) { .t-big { font-size: 26px; } .t-sh h2 { font-size: 21px; } }
.t-up { color: var(--t-red); } .t-down { color: var(--t-blue); } .t-flat { color: var(--t-text3); }

/* ── 작은 표시(칩) ── */
.t-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.t-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 8px; background: var(--t-fill);
  color: var(--t-text2); font-size: 13px; font-weight: 600; line-height: 1.4; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-chip.blue { background: var(--t-blue-weak); color: var(--t-blue-ink); }
.t-chip.red { background: var(--t-red-weak); color: var(--t-red-ink); }
.t-chip.green { background: var(--t-green-weak); color: var(--t-green-ink); }
.t-chip.orange { background: var(--t-orange-weak); color: var(--t-orange-ink); }
.t-chip.dark { background: var(--t-text); color: var(--t-card); }

/* ── 줄 목록: 왼쪽 이름, 오른쪽 값 ── */
.t-list { list-style: none; margin: 0; padding: 0; }
.t-li { display: flex; align-items: center; gap: 12px; padding: 13px 0; min-width: 0; }
.t-li + .t-li { border-top: 1px solid var(--t-line); }
.t-list.flat .t-li + .t-li { border-top: 0; }
.t-li .k { flex: 1; min-width: 0; font-size: 15px; color: var(--t-text2); }
.t-li .k small { display: block; font-size: 13px; color: var(--t-text3); }
.t-li .v { flex: none; text-align: right; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-li .v small { display: block; font-size: 13px; font-weight: 500; color: var(--t-text3); }
a.t-li { color: inherit; text-decoration: none; }
.t-li .go, .t-go::after { color: var(--t-text4); }
.t-go::after { content: "›"; margin-left: 4px; font-weight: 400; }

/* ── 숫자 칸 묶음(작은 카드 여러 개) ── */
.t-stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.t-stat { background: var(--t-soft); border-radius: var(--t-r2); padding: 14px 16px; min-width: 0; }
.t-stat .k { font-size: 13px; color: var(--t-text3); font-weight: 500; }
.t-stat .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.35; margin-top: 2px; }
.t-stat .d { font-size: 13px; color: var(--t-text2); margin-top: 2px; }

/* ── 단추 ── */
.t-btn { appearance: none; -webkit-appearance: none; border: 0; border-radius: 12px; padding: 10px 16px; font-size: 15px; font-weight: 600;
  background: var(--t-blue); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; line-height: 1.35; }
.t-btn:hover { filter: brightness(1.05); }
.t-btn.weak { background: var(--t-blue-weak); color: var(--t-blue-ink); }
.t-btn.grey { background: var(--t-fill); color: var(--t-text2); }
.t-btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.t-btn.block { display: flex; width: 100%; justify-content: center; padding: 14px 16px; font-size: 16px; border-radius: 14px; }

/* ── 고르기(세그먼트) ── */
.t-seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--t-fill); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.t-seg::-webkit-scrollbar { display: none; }
.t-seg button { flex: none; border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--t-text3); cursor: pointer; white-space: nowrap; }
.t-seg button.on { background: var(--t-card); color: var(--t-text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
:root[data-theme="dark"] .t-seg button.on { background: var(--t-fill2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-seg button.on { background: var(--t-fill2); } }

/* ── 접어 두는 설명: '자세히 보기' ── */
details.t-more { margin-top: 14px; }
details.t-more > summary { list-style: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px;
  border-radius: 12px; background: var(--t-fill); color: var(--t-text2); font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
details.t-more > summary::-webkit-details-marker { display: none; }
details.t-more > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
details.t-more[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
details.t-more > .t-more-in { padding: 16px 2px 2px; font-size: 15px; color: var(--t-text2); line-height: 1.65; }
details.t-more > .t-more-in p { margin: 0 0 10px; }
/* 글자 단추형(가볍게) */
details.t-more.text > summary { background: none; justify-content: flex-start; padding: 6px 0; color: var(--t-text3); }

/* ── 알림 상자 ── */
.t-notice { background: var(--t-fill); border-radius: var(--t-r2); padding: 14px 16px; font-size: 14px; color: var(--t-text2); line-height: 1.6; }
.t-notice b { color: var(--t-text); }
.t-notice.blue { background: var(--t-blue-weak); color: var(--t-blue-ink); }
.t-notice.blue b { color: inherit; }

/* ── 막대(어디쯤) ── */
.t-meter { position: relative; height: 8px; border-radius: 99px; background: var(--t-fill); overflow: hidden; }
.t-meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--t-blue); }

/* ── 표 ── */
.t-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.t-table th { font-size: 13px; font-weight: 500; color: var(--t-text3); text-align: right; padding: 8px 8px; white-space: nowrap; border-bottom: 1px solid var(--t-line); }
.t-table td { font-size: 15px; padding: 12px 8px; text-align: right; border-bottom: 1px solid var(--t-line); white-space: nowrap; }
.t-table th:first-child, .t-table td:first-child { text-align: left; padding-left: 0; }
.t-table th:last-child, .t-table td:last-child { padding-right: 0; }
.t-table tr:last-child td { border-bottom: 0; }

/* ── 이름표 위 말풍선(용어 설명·도표 값) ── */
.t-pop { background: var(--t-card); color: var(--t-text); border-radius: 14px; box-shadow: var(--t-pop); padding: 12px 14px; font-size: 14px; line-height: 1.55; }

/* ── 쪽 끝 ── */
.t-foot { margin: 40px 4px 0; font-size: 13px; color: var(--t-text3); line-height: 1.6; }
.t-hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

</style>
<style>
/* 뉴스 각도기 토스풍 틀(2026-11-07). 색·글꼴·공통 부품은 토스.css. 여기엔 이 앱에만 있는 색과 모양만 둔다.
   단계 색 --t1~--t4(지금 확인·오늘 안에·알아두기·참고), 엇갈림 --mixed, 새 소식 --new 는 토스 색에 이어 어두운 화면에서도 같이 바뀐다. */
:root{
  --t1:var(--t-red);--t2:var(--t-orange);--t3:var(--t-green);--t4:var(--t-text4);
  --mixed:var(--t-orange-ink);--new:var(--t-orange);
}
*{box-sizing:border-box}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* ── 머리: 앱 이름·갱신 시각·밝기 / 주제 탭(붙어 다님) ── */
header.top .in{max-width:760px;margin:0 auto;padding:20px 20px 6px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo img{width:30px;height:30px;border-radius:9px}
.stamp{color:var(--t-text3);font-size:13px;margin-left:auto;text-align:right;line-height:1.4;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t-text2);background:var(--t-card);flex:none}
.iconbtn:hover{background:var(--t-fill)}
nav.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--t-bg) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:99px;font-size:15px;font-weight:600;color:var(--t-text3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.35}
.tab:hover{color:var(--t-text2)}
.tab[aria-selected="true"]{background:var(--t-text);color:var(--t-card)}
.tab .dot{font-size:13px;font-weight:700;color:var(--t-red);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .dot{color:color-mix(in srgb,var(--t-red) 55%,var(--t-card))}
.banner{margin:12px 0 0;padding:14px 16px;border-radius:14px;background:var(--t-blue-weak);color:var(--t-blue-ink);font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.banner button{margin-left:auto;font-weight:700;font-size:14px;padding:7px 12px;border-radius:10px;background:var(--t-blue);color:#fff;white-space:nowrap}

/* ── 시세 띠: 작은 숫자 칸 ── */
.quotes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:6px -16px 0;padding:0 16px}
.quotes::-webkit-scrollbar{display:none}
.q{flex:none;background:var(--t-card);border-radius:16px;padding:12px 14px;min-width:108px}

<script>
const $ = s => document.querySelector(s);

const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

  return {up:'오름 압력',down:'내림 압력',mixed:'엇갈림'}[dir];
}

  const unit = o.pp ? '%' : o.unit === '원' ? '원' : '';
  const pre = o.unit === '달러' ? '$' : '';
  const chg = o.chg == null ? '' : `${a}${Math.abs(o.chg).toFixed(2)}${o.pp ? '%p' : '%'}`;
  return `<div class="q" title="${esc(o.name)} · ${fmt(o.time)} 기준${o.m1 != null ? ` · 한 달 ${o.m1 > 0 ? '+' : ''}${o.m1}${o.pp ? '%p' : '%'}` : ''}"><div class="n">${esc(o.name)}</div><div class="p">${pre}${num(o.price, o.nd > 2 ? 2 : o.nd)}${unit}</div><div class="c ${c}">${chg}</div></div>`;
}

const cs = (h, body, cls = '') => `<div class="cs${cls ? ' ' + cls : ''}"><h5>${h}</h5>${body}</div>`;
function cardHTML(s){
  const badge = isNew(s) ? '<span class="nw">새</span>' : isUpd(s) ? '<span class="upd">갱신</span>' : '';
  const imp = (s.impact || []).map(x => `<span class="t-chip ${DIRC[x.dir] || ''}">${esc(x.asset)} ${ARROW[x.dir] || ''}</span>`).join('');
  const nx = s.next ? `<span class="t-chip nx">${dday(s.next.date)} ${esc(s.next.what)}</span>` : '';
  let b = '';
  if (s.what?.length) b += cs('무슨 일', `<ul>${s.what.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
  if (s.why) b += cs('왜 중요한가', `<p>${esc(s.why)}</p>`);
  if (s.impact?.length) b += cs('자산시장 영향', s.impact.map(x => `<div class="row"><span class="t-chip ${DIRC[x.dir] || ''}">${esc(x.asset)} ${ARROW[x.dir] || ''}</span><span class="rt"><b>${dirWord(x.asset, x.dir)}</b><span>${esc(x.why)}</span></span></div>`).join(''));
  if (s.people?.length) b += cs('사람들에게', s.people.map(p => `<div class="pp"><span class="who">${esc(p.who)}</span><span class="ef">${esc(p.effect)}</span></div>`).join(''));
  if (s.next) b += cs('다음에 볼 일', `<div class="row"><span class="${ddClass(s.next.date)}">${dday(s.next.date)}</span><span>${md(s.next.date)} ${esc(s.next.what)}</span></div>`);
  if (s.links?.length) b += cs('다른 각도기에서 보기', `<div class="gkl">${s.links.map(l => `<a href="${esc(l.url)}">${esc(l.label)} <span>${{'종목': '주식 · 종목 판독', '업종': '주식 · 업종 공부', '지역': '부동산 · 지역', '코인': '코인 · 위치·열기'}[l.kind] || ''}</span> ›</a>`).join('')}</div>`);
  if (s.updates?.length) b += cs('이어진 소식', s.updates.map(u => `<div><span class="ut">${fmt(u.time)}</span>${esc(u.text)}</div>`).join(''), 'upds');
  if (s.terms?.length) b += cs('용어 풀이', `<dl class="terms">${s.terms.map(t => `<dt>${esc(t.t)}</dt><dd>${esc(t.e)}</dd>`).join('')}</dl>`);
  b += cs(`원문 기사 ${s.n}건 · 매체 ${s.nsrc}곳`, `<ul class="srcs">${s.srcs.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener"><span class="tx"><span class="st">${esc(a.title)}</span><span class="sm">${esc(a.src)} · ${fmt(a.time)}</span></span><span class="go">↗</span></a></li>`).join('')}</ul>`);
  b += `<div class="cs scale"><span>중요도 <span class="dots">${dots(s.imp)}</span></span><span>시급도 <span class="dots">${dots(s.urg)}</span></span><button class="link" data-rub>기준</button></div>`;
  if (s.check?.length) b += `<div class="warn">자동 대조에서 원문에 안 보이는 숫자가 남았습니다(${s.check.map(esc).join(', ')}). 원문으로 확인하세요.</div>`;
  b += `<button class="t-btn grey block fold" data-card="${s.id}" data-fold>접기</button>`;
  return `<article class="card t${s.tier}${opened.has(s.id) ? ' open' : ''}" id="c-${s.id}">
    <button class="ch" data-card="${s.id}" aria-expanded="${opened.has(s.id)}">
      <div class="meta"><span class="tp">${esc(s.topic)}</span>${badge}<span class="sp"></span><span>${ago(s.updated)}</span><span class="chev" aria-hidden="true"></span></div>
      <h3>${esc(s.title)}</h3><p class="one">${esc(s.one)}</p>
      ${imp || nx ? `<div class="imp">${imp}${nx}</div>` : ''}
    </button>
    <div class="cb"><div class="cbin">${b}</div></div></article>`;
}

function briefAll(){
  const b = D.brief; if (!b) return '';
  const byId = Object.fromEntries(D.stories.map(s => [s.id, s]));
  let h = '';
  const top = (b.top || []).filter(x => byId[x.id]);
  if (top.length) h += `<section class="sec"><div class="sh"><h2>지금 꼭 알 것</h2></div><div class="panel must">${top.map((x,i) => `<button data-go="${x.id}"><span class="k">${i+1}</span><span class="tx"><span class="tt">${esc(byId[x.id].title)}</span><span class="ln">${esc(x.line)}</span></span><span class="go">›</span></button>`).join('')}</div></section>`;
  if (b.minute?.length) h += `<section class="sec"><div class="sh"><h2>방송 전 1분 요약</h2><button class="t-btn weak sm" data-copy="prep">준비 노트 복사</button></div><div class="panel"><ul class="minute">${b.minute.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div></section>`;
  h += `<section class="sec"><div class="sh"><h2>주제별 지금</h2></div><div class="panel tnow">${D.topics.map(t => `<button data-tab="${esc(t)}"><span class="tx"><span class="tn">${esc(t)}</span><span class="tl">${esc(b.topics?.[t]?.now || '')}</span></span><span class="ar">›</span></button>`).join('')}</div></section>`;
  return h;
}

function briefTopic(t){
  const b = D.brief?.topics?.[t]; if (!b) return '';
  const extra = {'부동산': ['KR3YT=RR', 'KR10YT=RR'], '정책·생활': ['KRW=X', 'KR3YT=RR']}[t] || [];
  const qs = D.quotes.filter(o => o.topic === t || extra.includes(o.sym));
  let h = `<section class="sec" style="padding-top:20px"><div class="panel hero"><div class="ph"><span class="t-label">${esc(t)} 지금</span><span class="t-cap">브리핑 ${fmt(D.brief.made)}</span></div><p class="bnow">${esc(b.now)}</p>`;
  if (b.flow?.length) h += `<ul class="flow">${b.flow.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  if (qs.length) h += `<div class="t-chips qmini">${qs.map(o => `<span class="t-chip">${esc(o.name)} ${num(o.price, o.nd > 2 ? 2 : o.nd)} <b class="${o.chg > 0 ? 'pos' : o.chg < 0 ? 'neg' : 'zero'}">${o.chg > 0 ? '▲' : o.chg < 0 ? '▼' : ''}${Math.abs(o.chg ?? 0).toFixed(2)}${o.pp ? '%p' : '%'}</b></span>`).join('')}</div>`;
  h += '</div>';
  if (b.issues?.length) h += `<div class="panel"><div class="ph"><span class="t-label">쟁점</span><span class="t-cap">누르면 양쪽 시각</span></div>${b.issues.map(x => `<details class="issue"><summary>${esc(x.q)}</summary><p>${esc(x.sides)}</p></details>`).join('')}</div>`;
  if (b.ask?.length) h += `<div class="panel"><div class="ph"><span class="t-label">게스트에게 물어볼 것</span><button class="t-btn weak sm" data-copy="ask">복사</button></div><ol class="ask">${b.ask.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if (b.watch?.length) h += `<div class="panel"><div class="ph" style="margin-bottom:4px"><span class="t-label">다가오는 일정</span></div><ul class="t-list watch">${b.watch.map(w => `<li class="t-li"><span class="${ddClass(w.date)}">${dday(w.date)}</span><span class="k"><small>${md(w.date)}</small>${esc(w.what)}</span></li>`).join('')}</ul></div>`;
  return h + gkBox(t) + '</section>';
}

// ── 각도기 잇기: 다른 앱이 만든 요약(맨 위 바가 방금 받은 것, 없으면 이 판을 만들 때 넣어 둔 것). 코인은 10-16 더함 ──
const GK_OF = {'부동산': ['budongsan'], '주식': ['stock', 'reports'], '코인': ['coin']};
const gkData = id => (window.GK && GK.cache[id]) || D.gakdogi?.[id] || null;
function gkBox(t){
  return (GK_OF[t] || []).map(id => { const s = gkData(id); if (!s) return '';
    const parts = String(s.line || '').split(' · '), head = parts.shift();
    return `<div class="panel gk"><div class="gkh"><a href="${esc(s.url)}">${id === 'reports' ? '증권가 시각 · ' : ''}${esc(s.name)} ›</a><span class="t-cap">${esc(s.asof)}</span></div>
      <p class="gkl1">${esc(head)}</p>${parts.length ? `<div class="t-chips">${parts.map(x => `<span class="t-chip">${esc(x)}</span>`).join('')}</div>` : ''}
      ${(s.brief || []).length ? `<details class="t-more text"><summary>자세히 보기</summary><div class="t-more-in" style="padding-top:4px"><ul>${s.brief.slice(0, 4).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></details>` : ''}
      <a class="t-btn weak block gkgo" href="${esc(s.url)}">${esc(s.name)} 열기</a></div>`; }).join('');
}

function prepNote(){
  const b = D.brief; const L = [`[방송 준비 노트] ${fmt(D.built)} 기준`, ''];
  L.push('■ 1분 요약', ...(b.minute || []).map(x => '- ' + x), '');
  const gk = ['budongsan', 'stock', 'reports', 'coin'].map(gkData).filter(Boolean);
  if (gk.length){ L.push('■ 각도기 상태 (각 앱 규칙 결과 그대로)'); gk.forEach(s => { L.push(`[${s.name}] ${s.line} (${s.asof})`); (s.brief || []).forEach(x => L.push('- ' + x)); }); L.push(''); }
  const byId = Object.fromEntries(D.stories.map(s => [s.id, s]));
  if (b.top?.length){ L.push('■ 지금 꼭 알 것'); b.top.forEach((x,i) => byId[x.id] && L.push(`${i+1}. ${byId[x.id].title} (${x.line})`)); L.push(''); }
  for (const t of D.topics){
    const x = b.topics?.[t]; if (!x) continue;
    L.push(`■ ${t}: ${x.now}`); (x.flow || []).forEach(f => L.push('- ' + f));
    (x.issues || []).forEach(i => L.push(`쟁점: ${i.q} / ${i.sides}`));
    (x.ask || []).forEach((q,i) => L.push(`질문${i+1}. ${q}`));
    (x.watch || []).forEach(w => L.push(`일정: ${w.date} ${w.what}`));
    L.push('');
  }
  L.push('■ 시장 숫자', D.quotes.map(o => `${o.name} ${num(o.price, o.nd > 2 ? 2 : o.nd)} (${o.chg > 0 ? '+' : ''}${o.chg}${o.pp ? '%p' : '%'})`).join(', '));
  return L.join('\n');
}

function renderTabs(){
  const cnt = t => D.stories.filter(s => s.topic === t && s.tier <= 2).length;
  const all = ['전체', ...D.topics];
  $('#tabs').innerHTML = all.map(t => { const n = t === '전체' ? D.stories.filter(s => s.tier === 1).length : cnt(t); return `<button class="tab" role="tab" data-tab="${esc(t)}" aria-selected="${t === tab}">${esc(t)}${n ? `<span class="dot" aria-label="중요 ${n}건">${n}</span>` : ''}</button>`; }).join('');
}

function resultsHTML(){
  let h = '';
  const list = D.stories.filter(storyMatch), all = filtering();
  if (!list.length) h += `<div class="empty">조건에 맞는 뉴스가 없습니다.${query ? ` <a href="https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(query)}" target="_blank" rel="noopener">네이버 뉴스에서 '${esc(query)}' 찾기 ↗</a>` : ''}</div>`;
  for (const t of [1,2,3,4]){
    const g = list.filter(s => s.tier === t); if (!g.length) continue;
    const lim = all || moreTier.has(t) ? g.length : LIM[t], rest = g.length - lim;
    h += `<div class="tierh"><i style="background:var(--t${t})"></i><b>${TIER[t][0]}</b><span>${TIER[t][1]} · ${g.length}건</span></div><div class="list">${g.slice(0, lim).map(cardHTML).join('')}</div>`;
    if (rest > 0) h += `<button class="t-btn grey block more" data-more="${t}">${TIER[t][0]} ${rest}건 더 보기</button>`;
  }
  const others = (D.others || []).filter(s => (tab === '전체' || s.topic === tab) && !assetSel.size && !onlyNew && (!query || (s.title + ' ' + s.srcs.map(a => a.title).join(' ')).toLowerCase().includes(query)));
  if (others.length) h += `<details class="others"><summary>그 밖의 소식 ${others.length}건 (제목만)</summary>${others.map(s => `<div class="orow"><span class="om"><span class="tp">${esc(s.topic)}</span><span>${ago(s.updated)}</span></span><a href="${esc(s.srcs[0]?.url || '#')}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join('')}</details>`;
  return h;
}

function render(){
  if (!D) return;
  const nextLabel = D.next ? (new Date(D.next).toDateString() === new Date().toDateString() ? fmt(D.next).split(' ')[1] : fmt(D.next)) : '';
  $('#stamp').innerHTML = view === 'latest' ? `${ago(D.built)} 갱신${nextLabel ? `<br>다음 ${nextLabel}` : ''}` : `${fmt(D.built)} 기록`;
  renderTabs();
  let h = '';
  if (view !== 'latest') h += `<div class="banner">${esc(D.built.slice(5,10).replace('-','월 '))}일 마지막 판을 보는 중<button data-day="">오늘로</button></div>`;
  h += `<div class="quotes">${D.quotes.map(quoteChip).join('')}</div><p class="qnote">전일 대비(코인은 24시간)</p>`;
  h += tab === '전체' ? briefAll() : briefTopic(tab);
  h += `<section class="sec filters"><div class="sh" style="margin-bottom:2px"><h2>${tab === '전체' ? '모든 소식' : esc(tab) + ' 소식'}</h2></div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t-text3);flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="뉴스 찾기 (예: 전세, 하이닉스, 금리)" value="${esc(query)}" autocomplete="off"></div>
    <div class="chips"><span class="lab">영향</span>${ASSETS.map(a => `<button class="chip" data-asset="${esc(a)}" aria-pressed="${assetSel.has(a)}">${esc(a)}</button>`).join('')}${view === 'latest' && prevSeen ? `<button class="chip" data-new aria-pressed="${onlyNew}">지난번 뒤 새 소식</button>` : ''}</div></section>`;
  h += `<div id="results">${resultsHTML()}</div>`;
  h += `<footer>
    ${days.length ? `<div><div class="fh">지난 기록</div><div class="days">${days.map((d,i) => `<button data-day="${d}" aria-pressed="${i ? view === d : view === 'latest'}">${d.slice(5).replace('-','/')}</button>`).join('')}</div></div>` : ''}
    <p>뉴스 ${D.feeds.ok}/${D.feeds.total}곳에서 모아 Claude가 묶고 요약했습니다. ${D.schedule ? `정기 갱신은 평일 ${D.schedule.weekday.join(' · ')}, 주말·공휴일 ${D.schedule.rest.join(' · ')}에 반영됩니다.` : ''} <button class="link" data-rub>우선순위 기준</button></p>
    ${D.feeds.failed.length ? `<p>이번에 못 받은 곳: ${D.feeds.failed.map(esc).join(', ')}</p>` : ''}
    <p>시세는 늦을 수 있음(네이버·야후 파이낸스·업비트).</p>
    <p>자동 요약이라 틀릴 수 있으니 중요한 숫자는 원문 기사로 확인하세요. 투자 권유가 아닙니다.</p>
  </footer>`;
  $('#app').innerHTML = h;
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); $('#results').innerHTML = resultsHTML(); });
}

function openCard(id, scroll){
  opened.add(id);
  const s = D.stories.find(s => s.id === id);
  if (!D.stories.find(s => s.id === id && (tab === '전체' || s.topic === tab))) tab = '전체';
  if (s) moreTier.add(s.tier);
  assetSel.clear(); onlyNew = false; query = '';
  render();
  const el = document.getElementById('c-' + id);
  if (el && scroll) el.scrollIntoView({behavior:'smooth', block:'start'});
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.card){
    const id = t.dataset.card; opened.has(id) ? opened.delete(id) : opened.add(id);
    const c = document.getElementById('c-' + id); c.classList.toggle('open', opened.has(id));
    c.querySelector('.ch').setAttribute('aria-expanded', opened.has(id));
    if ('fold' in t.dataset) c.scrollIntoView({block:'nearest'});
    history.replaceState(null, '', opened.has(id) ? '#s=' + id : '#'); return;
  }
  if (t.dataset.more){ moreTier.add(+t.dataset.more); $('#results').innerHTML = resultsHTML(); return; }
  if (t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo({top:0}); document.querySelector(`.tab[data-tab="${CSS.escape(tab)}"]`)?.scrollIntoView({inline:'center', block:'nearest'}); return; }
  if (t.dataset.go){ openCard(t.dataset.go, true); return; }
  if (t.dataset.asset){ const a = t.dataset.asset; assetSel.has(a) ? assetSel.delete(a) : assetSel.add(a); render(); return; }
  if ('new' in t.dataset){ onlyNew = !onlyNew; render(); return; }
  if ('rub' in t.dataset){ $('#rubText').textContent = D.rubric || ''; $('#rub').showModal(); return; }
  if (t.dataset.copy === 'prep'){ copy(prepNote()); return; }
  if (t.dataset.copy === 'ask'){ const b = D.brief.topics[tab]; copy(`[${tab}] 게스트 질문\n` + b.ask.map((x,i) => `${i+1}. ${x}`).join('\n')); return; }
  if ('day' in t.dataset){ const d = t.dataset.day; (d && d !== days[0] ? load(d) : load()).then(() => window.scrollTo({top:0})); return; }
  if (t.id === 'themeBtn'){ const cur = document.documentElement.dataset.theme; const sysDark = matchMedia('(prefers-color-scheme: dark)').matches; const next = (cur ? cur === 'dark' : sysDark) ? 'light' : 'dark'; document.documentElement.dataset.theme = next; LS.set('ng_theme', next); return; }
});

(async function init(){
  const th = LS.get('ng_theme'); if (th) document.documentElement.dataset.theme = th;
  prevSeen = LS.get('ng_seen');
  try { await load(); } catch(e){ $('#app').innerHTML = '<div class="loading">자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>'; return; }
  LS.set('ng_seen', D.built);
  try { days = await (await fetch('data/days.json?t=' + Date.now(), {cache:'no-store'})).json(); render(); } catch(e){}
  if (!fromHash()){ const m = location.hash.match(/s=([^&]+)/); if (m) openCard(decodeURIComponent(m[1]), true); }
  addEventListener('hashchange', fromHash);
  // 앱을 다시 열면 새 판이 있는지 확인
  let lastCheck = Date.now();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || view !== 'latest' || Date.now() - lastCheck < 5*60e3) return;
    lastCheck = Date.now();
    try { const r = await fetch('data/latest.json?t=' + Date.now(), {cache:'no-store'}); const n = await r.json(); if (n.built !== D.built){ prevSeen = D.built; D = n; LS.set('ng_seen', D.built); render(); toast('새 판으로 바꿨습니다'); } else render(); } catch(e){}
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
// 다른 각도기에서 온 주소: #topic=부동산 (그 주제 탭) · #q=삼성전자 (그 이름이 든 소식 찾기)
function fromHash(){
  const m = location.hash.match(/^#(topic|q)=(.+)$/); if (!m || !D) return false;
  const v = decodeURIComponent(m[2]);
  assetSel.clear(); onlyNew = false;
  if (m[1] === 'topic'){ if (!D.topics.includes(v)) return false; tab = v; query = ''; render(); window.scrollTo({top: 0}); }
  else { tab = '전체'; query = v.trim().toLowerCase(); render(); document.querySelector('.filters')?.scrollIntoView({block: 'start'}); }
  return true;
}
</script>
<script data-app="news">
/* 각도기 바: 네 각도기(뉴스·부동산·주식·코인)를 서로 잇는다. 코인은 2026-10-16에 네 번째로 더함.
   원본은 C:\Users\jjang\각도기 공통\각도기바.js. 각 앱 만들기 코드가 화면 끝의 자리표시(README 참고)에
   script 태그(data-app=앱 이름)로 끼워 넣는다. 고칠 땐 원본만 고치고 네 앱(과 리포트판)을 다시 만든다.
   2026-11-07 토스풍: 맨 위는 앱 이름 알약만(지금 앱은 진하게), 요약 글은 '한눈에'를 펼쳤을 때만 카드로.
   - '네 시장 한눈에': 네 앱 요약을 펼쳐 봄(앱마다 한 줄 + 숫자 몇 개)
   - 밝게/어둡게: 같은 주소(jjangguss-prog.github.io) 안이라 한 앱에서 바꾸면 모두 같이 바뀐다
   - window.GK: 앱 코드가 다른 앱 주소를 만들거나 요약을 읽을 때 쓴다 */
(() => {
  const ME = (document.currentScript && document.currentScript.dataset.app) || '';
  const BASE = 'https://jjangguss-prog.github.io/';
  const APPS = [
    {id: 'news', name: '뉴스 각도기', short: '뉴스', path: 'news-gakdogi/'},
    {id: 'budongsan', name: '부동산 각도기', short: '부동산', path: 'budongsan-gakdogi/'},
    {id: 'stock', name: '주식 각도기', short: '주식', path: 'stock-gakdogi/'},
    {id: 'coin', name: '코인 각도기', short: '코인', path: 'coin-gakdogi/', soon: true},
  ];
  // 주식 각도기 안의 리포트판은 주식 줄 아래에 붙인다(앱으로 따로 세지 않는다)
  const SUBS = {stock: [{id: 'reports', name: '증권사 리포트', short: '리포트', path: 'stock-gakdogi/reports/'}]};
  const app = id => APPS.find(a => a.id === id) || Object.values(SUBS).flat().find(a => a.id === id);
  const url = (id, key, val) => BASE + app(id).path + (key ? '#' + key + (val != null ? '=' + encodeURIComponent(val) : '') : '');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const LS = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
              set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
  const cache = {};
  const get = id => (cache['_' + id] = cache['_' + id] || fetch(BASE + app(id).path + 'summary.json?t=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null).then(j => (cache[id] = j && j.v ? j : null)).catch(() => (cache[id] = null)));
  window.GK = {me: ME, base: BASE, apps: APPS, url, get, cache};

  // ── 밝게/어둡게 같이 쓰기 ──────────────────────────
  const TK = 'gakdogi.theme';
  const OWN = {stock: ['sg.theme', true], budongsan: ['ondo-theme', false], news: ['ng_theme', false]};   // 코인은 gakdogi.theme 를 바로 씀
  const root = document.documentElement;
  const t0 = LS.get(TK);
  if ((t0 === 'dark' || t0 === 'light') && t0 !== root.getAttribute('data-theme')) {
    root.setAttribute('data-theme', t0);
    const own = OWN[ME]; if (own) LS.set(own[0], own[1] ? JSON.stringify(t0) : t0);
    if (typeof renderAll === 'function') { try { renderAll(); } catch (e) {} }   // 그래프 색을 새 테마로
  }
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('#themeBtn, #theme')) setTimeout(() => { const t = root.getAttribute('data-theme'); if (t) LS.set(TK, t); }, 0);
  });

  // ── 바 ─────────────────────────────────────────────
  const css = `
.gk-bar{--gk-bg:var(--t-card,var(--surface,var(--panel,#fff)));--gk-ink:var(--t-text,var(--ink,var(--text,#191f28)));--gk-mut:var(--t-text3,var(--muted,#8b95a1));
  --gk-mut2:var(--t-text2,var(--ink2,#4e5968));--gk-line:var(--t-line,var(--line,#e5e8eb));--gk-fill:var(--t-fill,var(--raised,#f2f4f6));--gk-page:var(--t-bg,var(--page,#f2f4f6));
  --gk-blue:var(--t-blue,#3182f6);--gk-blue-weak:var(--t-blue-weak,#e8f3ff);--gk-blue-ink:var(--t-blue-ink,#1b64da);
  background:var(--gk-bg);color:var(--gk-ink);border-bottom:1px solid var(--gk-line);position:relative;z-index:25;
  font:14px/1.5 var(--t-font,"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif);letter-spacing:-.01em;word-break:keep-all}
.gk-row{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center}
.gk-in{flex:1;min-width:0;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.gk-in::-webkit-scrollbar{display:none}
.gk-bar .gk-i{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;white-space:nowrap;text-decoration:none;color:var(--gk-mut);font-weight:600;font-size:14px}
.gk-bar a.gk-i:hover{background:var(--gk-fill);color:var(--gk-mut2)}
.gk-bar span.gk-i{background:var(--gk-ink);color:var(--gk-bg)}
.gk-bar .gk-i i{width:6px;height:6px;border-radius:50%;background:var(--gk-mut);opacity:.5}
.gk-bar .gk-i i.on{background:#03b26c;opacity:1}
.gk-bar span.gk-i i{display:none}
.gk-bar button.gk-t{flex:none;border:0;background:var(--gk-blue-weak);color:var(--gk-blue-ink);border-radius:99px;padding:6px 12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.gk-p{display:none;max-width:1120px;margin:0 auto;padding:4px 16px 16px}
.gk-bar.open .gk-p{display:grid;grid-template-columns:repeat(var(--gk-n,4),minmax(0,1fr));gap:10px}
@media (max-width:1100px){.gk-bar.open .gk-p{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.gk-bar.open .gk-p{grid-template-columns:1fr}.gk-row{padding:8px 12px}}
.gk-c{border-radius:16px;padding:16px;background:var(--gk-page);min-width:0}
.gk-c .gk-h{display:flex;align-items:center;gap:6px}
.gk-c .gk-h a,.gk-c .gk-h b{font-size:15px;font-weight:700;color:var(--gk-ink);text-decoration:none}
.gk-c .gk-h small{margin-left:auto;color:var(--gk-mut);font-size:12.5px;white-space:nowrap}
.gk-c .gk-line{font-weight:700;font-size:17px;margin:6px 0 0;line-height:1.45;letter-spacing:-.02em}
.gk-c .gk-todo{color:var(--gk-mut2);font-size:14px;margin-top:4px}
.gk-c .gk-f{list-style:none;margin:10px 0 0;padding:0}
.gk-c .gk-f li{display:flex;gap:8px;align-items:baseline;padding:5px 0;font-size:14px}
.gk-c .gk-f li span{color:var(--gk-mut2);flex:1;min-width:0}
.gk-c .gk-f li b{font-variant-numeric:tabular-nums;font-weight:700}
.gk-c .gk-f li i{font-style:normal;color:var(--gk-mut);font-size:12.5px;margin-left:4px}
.gk-c .gk-lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gk-c .gk-lk a{border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;color:var(--gk-blue-ink);background:var(--gk-blue-weak)}
.gk-c .gk-sub{margin-top:10px;padding-top:10px;border-top:1px solid var(--gk-line);font-size:14px}
.gk-c .gk-sub a{color:var(--gk-ink);font-weight:700;text-decoration:none}
.gk-note{grid-column:1/-1;color:var(--gk-mut);font-size:12.5px;margin:2px 0 0}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const bar = document.createElement('div'); bar.className = 'gk-bar'; bar.setAttribute('role', 'navigation'); bar.setAttribute('aria-label', '각도기 앱 바로가기');
  const ago = iso => { const h = (Date.now() - new Date(iso)) / 36e5; return !isFinite(h) ? '' : h < 1 ? '방금' : h < 24 ? `${Math.floor(h)}시간 전` : `${Math.floor(h / 24)}일 전`; };
  const stale = iso => (Date.now() - new Date(iso)) / 36e5 > 30;
  // 맨 위 줄: 앱 이름 알약만. 요약 한 줄은 마우스를 올리면(title) 보이고, 펼친 카드에 크게.
  const item = a => {
    const s = cache[a.id], tip = s ? `${a.name} · ${s.line}${stale(s.updated) ? ` (${ago(s.updated)})` : ''}` : a.name;
    if (a.id === ME) return `<span class="gk-i" aria-current="page" title="${esc(tip)}">${esc(a.short)}</span>`;
    return `<a class="gk-i" href="${url(a.id)}" title="${esc(tip)} 열기"><i class="${s && !stale(s.updated) ? 'on' : ''}"></i>${esc(a.short)}</a>`;
  };
  const facts = s => (s.facts || []).slice(0, 4).map(f => `<li><span>${esc(f.k)}</span><b>${esc(f.v)}</b>${f.d ? `<i>${esc(f.d)}</i>` : ''}</li>`).join('');
  const links = s => (s.links || []).slice(0, 3).map(l => `<a href="${esc(l.url)}">${esc(l.label)} ›</a>`).join('');
  const cardOf = a => {
    const s = cache[a.id], h = a.id === ME ? `<b>${esc(a.name)}</b>` : `<a href="${url(a.id)}">${esc(a.name)} ›</a>`;
    if (!s) return `<div class="gk-c"><div class="gk-h">${h}</div><div class="gk-todo">요약을 불러오지 못했어요.</div></div>`;
    const sub = (SUBS[a.id] || []).map(x => cache[x.id] ? `<div class="gk-sub"><a href="${url(x.id)}">${esc(x.name)} ›</a><div class="gk-todo">${esc(cache[x.id].line)}</div></div>` : '').join('');
    return `<div class="gk-c"><div class="gk-h">${h}<small>${esc(stale(s.updated) ? ago(s.updated) + ' 갱신' : s.asof)}</small></div>
      <div class="gk-line">${esc(s.line)}</div>${s.todo ? `<div class="gk-todo">${esc(s.todo)}</div>` : ''}
      ${facts(s) ? `<ul class="gk-f">${facts(s)}</ul>` : ''}${links(s) ? `<div class="gk-lk">${links(s)}</div>` : ''}${sub}</div>`;
  };
  const open = () => LS.get('gakdogi.panel') === '1';
  // soon: 새로 더한 앱은 그 앱 요약을 실제로 받아 왔을 때만 보인다(공개 주소가 아직 없으면 깨진 링크를 안 보이게)
  const shown = () => APPS.filter(a => !a.soon || a.id === ME || cache[a.id]);
  const draw = () => {
    bar.classList.toggle('open', open());
    const A = shown();
    bar.style.setProperty('--gk-n', A.length);
    bar.innerHTML = `<div class="gk-row"><div class="gk-in">${A.map(item).join('')}</div><button class="gk-t" type="button" aria-expanded="${open()}">${open() ? '접기' : '시장 한눈에'}</button></div>
      <div class="gk-p">${A.map(cardOf).join('')}<p class="gk-note">앱마다 따로 갱신한 요약이에요. 투자 권유가 아닙니다.</p></div>`;
  };
  bar.addEventListener('click', e => { if (e.target.closest('button.gk-t')) { LS.set('gakdogi.panel', open() ? '0' : '1'); draw(); } });
  draw();
  document.body.insertBefore(bar, document.body.firstChild);
  Promise.all([...APPS, ...Object.values(SUBS).flat()].map(a => get(a.id))).then(draw);
})();

</script>
</body>
</html>
